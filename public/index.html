<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Chat Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one narrow column — a form card, then the recap read like a memo. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --fg: #17201b; --muted: #5b675f;
  --line: #d9dfd9; --accent: #1f7a55; --accent-fg: #ffffff; --accent-soft: #e2f0e8;
  --error: #b3261e;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --surface: #18201c; --fg: #e5ece7; --muted: #9aa8a0;
  --line: #2b3630; --accent: #4cc28d; --accent-fg: #0b1a12; --accent-soft: #1d3329;
  --error: #f2948c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #18201c; --fg: #e5ece7; --muted: #9aa8a0;
  --line: #2b3630; --accent: #4cc28d; --accent-fg: #0b1a12; --accent-soft: #1d3329;
  --error: #f2948c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body);
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
header h1 { font: 600 clamp(26px, 5vw, 34px)/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 60ch; }

form {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; display: grid; gap: 16px;
}
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 8px; }
.drop {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; cursor: pointer;
}
.drop:hover, .drop:focus-within { border-color: var(--accent); }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pick { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 7px 12px; border-radius: 7px; }
#file-meta { font: 13px var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font: 600 15px var(--body); border-radius: 8px; padding: 10px 18px; cursor: pointer;
  border: 1px solid transparent;
}
button:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#submit { background: var(--accent); color: var(--accent-fg); }
#submit:disabled { opacity: .55; cursor: progress; }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }

#status { margin: 0; font-size: 14px; color: var(--muted); }
#status[data-tone="error"] { color: var(--error); }

.result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.result-head h2 { font: 600 20px var(--display); margin: 0; }
#copy { padding: 6px 12px; font-size: 13px; }
#result { border-top: 2px solid var(--fg); padding-top: 14px; min-width: 0; overflow-wrap: anywhere; }
#result[data-state="empty"], #result[data-state="loading"] { color: var(--muted); }
#result[data-state="loading"] { animation: pulse 1.4s ease-in-out infinite; }
#result h3 { font: 600 16px var(--body); margin: 18px 0 4px; }
#result h3:first-child { margin-top: 0; }
#result ul, #result ol { margin: 0 0 6px; padding-left: 20px; }
#result li { margin: 2px 0; }
#result p { margin: 6px 0; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { #result[data-state="loading"] { animation: none; } }
input[type="password"] {
  font: 15px var(--body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; max-width: 320px;
}
input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

</head>
<body>
<main>
  <header>
    <h1>WA Chat Recap</h1>
    <p>Upload a WhatsApp chat export and Claude groups it by topic: decisions, open items, and next steps.</p>
  </header>

  <form id="form" novalidate>
    <div class="field">
      <span class="label" id="upload-label">Upload</span>
      <label class="drop" for="chat-file">
        <input type="file" id="chat-file" accept=".txt,text/plain" aria-labelledby="upload-label">
        <span class="pick">Choose .txt file</span>
        <span id="file-meta">No file chosen</span>
      </label>
      <p class="hint">In WhatsApp: open the chat → More → Export chat → Without media.</p>
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Leave empty if not set">
    </div>
    <div class="actions">
      <button type="submit" id="submit">Submit</button>
      <button type="button" id="stop" class="ghost" hidden>Stop</button>
    </div>
    <p id="status" hidden></p>
  </form>

  <section aria-labelledby="result-title">
    <div class="result-head">
      <h2 id="result-title">Summary Result :</h2>
      <button type="button" id="copy" class="ghost" hidden>Copy summary</button>
    </div>
    <div id="result" data-state="empty" aria-live="polite">The recap appears here after you submit a chat file.</div>
  </section>
</main>

<script src="/app.js" defer></script>
</body>
</html>
